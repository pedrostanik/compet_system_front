name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      # Non-blocking until the existing lint errors are fixed; then remove continue-on-error.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
        env:
          VITE_API_URL: https://petshopcompet.com.br
